<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Coca-Cola — La Felicidad que se Contagia</title>
    <meta name="theme-color" content="#f40009" />
    <link rel="preload" href="assets/fonts/Lobster.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/Fraunces.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="style.css?v=12" />
  </head>
  <body>
    <div id="app">
      <!-- Capas de atmósfera: rojo Coca-Cola progresivo, grano de papel y efervescencia -->
      <div id="bgHeat" aria-hidden="true"></div>
      <div id="bgGrain" aria-hidden="true"></div>
      <canvas id="fizzCanvas" aria-hidden="true"></canvas>


      <!-- Escenario SVG principal a pantalla completa -->
      <svg
        id="scene"
        viewBox="0 0 1440 900"
        preserveAspectRatio="xMidYMid meet"
        overflow="visible"
        aria-label="Experiencia interactiva tipográfica Coca-Cola"
      >
        <defs>
          <!-- Filtro de sombra suave para manos y rasgos -->
          <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.12" />
          </filter>

          <!-- Gradiente de la burbuja tímida -->
          <radialGradient id="timidGlow" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
            <stop offset="45%" stop-color="#ffebee" stop-opacity="0.6" />
            <stop offset="80%" stop-color="#ffcdd2" stop-opacity="0.35" />
            <stop offset="100%" stop-color="#fe001a" stop-opacity="0.4" />
          </radialGradient>

          <!-- Brillo de vidrio para las letras (efecto botella) -->
          <linearGradient id="glyphGloss" x1="0" y1="0" x2="0.35" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
            <stop offset="32%" stop-color="#ffffff" stop-opacity="0.12" />
            <stop offset="48%" stop-color="#ffffff" stop-opacity="0" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0.14" />
          </linearGradient>

          <!-- Burbuja efervescente de la palabra -->
          <radialGradient id="wordBubbleFill" cx="38%" cy="34%" r="70%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
            <stop offset="38%" stop-color="#ffffff" stop-opacity="0.55" />
            <stop offset="78%" stop-color="#ffffff" stop-opacity="0.22" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
          </radialGradient>

          <!-- Destello de cuatro puntas -->
          <symbol id="sparkle" viewBox="-10 -10 20 20" overflow="visible">
            <path d="M0 -10 C 1 -3 3 -1 10 0 C 3 1 1 3 0 10 C -1 3 -3 1 -10 0 C -3 -1 -1 -3 0 -10 Z" />
          </symbol>

          <!-- Gradiente de burbuja normal -->
          <radialGradient id="bubbleGlow" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
            <stop offset="55%" stop-color="#ffffff" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
          </radialGradient>
        </defs>

        <!-- Capa de fondo: cinta dinámica ondulada -->
        <g id="bgDecorLayer">
          <g id="ribbonRed" class="ribbon-set">
            <path class="ribbon-band" d="M -1400 830 C -900 800, -400 860, -40 812 C 260 742, 520 868, 790 806 C 1060 744, 1250 770, 1480 734 C 1900 680, 2300 760, 2840 720 L 2840 2600 L -1400 2600 Z" />
            <path class="ribbon-line" d="M -1400 800 C -900 770, -400 830, -40 776 C 280 712, 540 842, 800 778 C 1060 716, 1260 742, 1480 700 C 1900 650, 2300 730, 2840 690" />
          </g>
          <g id="ribbonWhite" class="ribbon-set">
            <path class="ribbon-band" d="M -1400 830 C -900 800, -400 860, -40 812 C 260 742, 520 868, 790 806 C 1060 744, 1250 770, 1480 734 C 1900 680, 2300 760, 2840 720 L 2840 2600 L -1400 2600 Z" />
            <path class="ribbon-line" d="M -1400 800 C -900 770, -400 830, -40 776 C 280 712, 540 842, 800 778 C 1060 716, 1260 742, 1480 700 C 1900 650, 2300 730, 2840 690" />
          </g>
        </g>

        <!-- Sombras de contacto de los personajes -->
        <g id="shadowLayer"></g>

        <!-- Capa de personajes tipográficos (C, O, L, A) -->
        <g id="letterLayer"></g>

        <!-- Resplandor y guía de la palabra «Coca» (detrás de las burbujas) -->
        <g id="wordBackLayer"></g>

        <!-- Capa de burbujas flotantes y tímida -->
        <g id="bubbleLayer"></g>

        <!-- Floritura y destellos de la palabra «Coca» -->
        <g id="wordFormationLayer"></g>
      </svg>

      <!-- Botón discreto de control de sonido -->
      <button id="soundToggle" class="sound-toggle" aria-label="Silenciar o activar sonido" title="Sonido">
        <svg id="soundIconOn" class="sound-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <svg id="soundIconOff" class="sound-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display:none;">
          <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
      </button>

      <!-- Revelación final del logo oficial blanco de Coca-Cola -->
      <div id="brandReveal" aria-hidden="true">
        <svg class="reveal-ribbon" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true">
          <path class="rr rr-1" pathLength="1" d="M -60 735 C 240 650, 470 830, 760 730 C 1040 635, 1240 690, 1500 600" />
          <path class="rr rr-2" pathLength="1" d="M -60 782 C 260 702, 500 870, 780 776 C 1050 688, 1250 738, 1500 652" />
        </svg>
        <div class="reveal-stack">
          <div class="logo-wrap">
            <img id="cocaLogo" src="assets/Coca-Cola_logo_white.png" alt="Coca-Cola" />
            <span class="logo-shine"></span>
          </div>
          <p class="reveal-tagline">La felicidad <em>se contagia</em></p>
          <button id="replayBtn" type="button">Volver a jugar</button>
        </div>
      </div>

      <!-- Cursor personalizado con el lápiz original SVG -->
      <div id="pencilCursor" aria-hidden="true">
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g>
            <polygon class="pencil-wood" points="180.006,414.017 171.785,422.16 115.097,478.926 115.019,478.926 113.923,480.023 113.844,479.945 113.375,479.474 113.297,479.474 73.6,439.701 72.895,439.074 72.19,438.29 32.494,398.671 31.867,398.046 97.95,331.961" />
            <path class="pencil-white" d="M511.439,67.631c-0.627,2.739-2.036,5.402-4.15,7.516l-35.938,35.937l-7.673,7.673l-4.15,4.15 c-6.264,6.264-16.599,6.264-22.941,0l-23.724-23.724L389.06,75.38c-6.342-6.341-6.342-16.676,0-22.941l4.15-4.15l7.673-7.673 l9.552-9.552L436.743,4.68c2.114-2.114,4.776-3.525,7.595-4.15c5.324-1.409,11.275,0,15.425,4.15l23.724,23.803l23.802,23.722 C511.439,56.355,512.848,62.305,511.439,67.631z" />
            <polygon class="pencil-black" points="477.145,116.88 404.72,189.306 363.692,148.276 322.664,107.248 395.089,34.823 471.351,111.085" />
            <polygon class="pencil-red" points="486.697,107.248 477.145,116.88 469.472,124.473 463.678,118.757 393.21,48.29 387.416,42.498 404.641,25.271 480.903,101.533" />
            <polygon class="pencil-red" points="417.874,176.072 404.72,189.306 309.901,284.123 180.006,414.017 171.785,422.16 130.835,381.134 89.808,340.105 97.95,331.961 227.845,202.067 322.664,107.248 335.818,94.095 376.846,135.122" />
            <path class="pencil-wood" d="M115.019,478.926l-1.096,0.314l-0.548,0.235h-0.078l-72.112,20.907 c-0.078-0.157-0.157-0.237-0.157-0.392c-3.132-6.029-7.125-11.745-12.214-16.835c-5.089-5.089-10.805-9.16-16.912-12.215 c-0.078-0.076-0.235-0.076-0.313-0.157l20.906-72.112l0.235-0.703l0.314-1.097l0.861,0.862L74.07,437.9l1.488,1.487l38.601,38.6 L115.019,478.926z" />
            <path class="pencil-tip" d="M41.654,499.833l-0.626,0.157l-0.078,0.078l-26.543,7.751L0,511.969l4.15-14.407l7.751-26.622 l0.235-0.703c6.186,3.131,12.058,7.203,17.226,12.372C34.529,487.775,38.601,493.647,41.654,499.833z" />
            <polygon class="pencil-red" points="309.901,284.123 180.006,414.017 115.097,478.926 113.766,480.258 113.844,479.945 113.923,479.239 114.158,477.987 122.457,431.087 75.557,439.387 73.6,439.701 71.955,440.012 71.877,440.012 72.19,438.29 72.504,436.333 80.803,389.432 33.903,397.732 32.728,397.968 31.945,398.124 31.789,398.124 97.95,331.961 227.845,202.067" />
          </g>
        </svg>
      </div>
    </div>

    <script src="sketch.js?v=12"></script>
  </body>
</html>
